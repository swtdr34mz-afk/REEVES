# Builds REEVES for Windows (VST3, Standalone) and the Mac (VST3, AU, Standalone; Apple Silicon and Intel) on every
# push. The zips are under the run's "Artifacts"; a tag v* (or a release published on GitHub) also puts them in its
# release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # the engine's tests (tests/engine_tests.cpp): every program at three rates, every effect, both filters, unison,
  # the arp, both sequencers, stack and split, 8 voices, any buffer size; no JUCE needed
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release && cmake --build build-tests --parallel 4
      - name: run
        run: build-tests/engine_tests

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-15-intel
            name: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: pluginval (Windows)
        # the plugin checked as a host would: loading, its parameters fuzzed, state saved and restored, the editor
        # opened, every buffer size and rate (Tracktion's pluginval, strictness 8)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath pluginval/pluginval.exe -ArgumentList '--strictness-level','8','--timeout-ms','600000','--output-dir','pluginval-log','--validate','"build/Reeves_artefacts/Release/VST3/REEVES.vst3"' -Wait -PassThru -NoNewWindow
          Get-ChildItem pluginval-log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 60 }
          if ($p.ExitCode -ne 0) { throw "pluginval failed ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: pluginval-log
          path: pluginval-log
          if-no-files-found: ignore

      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $a = "build/Reeves_artefacts/Release"
          $o = "REEVES-Windows"
          New-Item -ItemType Directory -Force $o | Out-Null
          Copy-Item -Recurse "$a/VST3/REEVES.vst3" $o/
          Copy-Item "$a/Standalone/REEVES.exe" $o/
          Copy-Item README.md $o/
          Compress-Archive -Path $o -DestinationPath REEVES-Windows.zip

      - name: auval (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Reeves_artefacts/Release/AU/REEVES.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Rvs2 Swtd

      - name: package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          a="build/Reeves_artefacts/Release"
          o=REEVES-macOS
          mkdir -p $o
          cp -R "$a/VST3/REEVES.vst3" "$a/AU/REEVES.component" "$a/Standalone/REEVES.app" $o/
          for b in $o/*.vst3 $o/*.component $o/*.app; do codesign --force --deep -s - "$b"; done
          cp README.md $o/
          lipo -info "$o/REEVES.vst3/Contents/MacOS/REEVES"
          ditto -c -k --sequesterRsrc --keepParent $o $o.zip
          tar -czf $o.tar.gz $o   # (the same as a .tar.gz: some Macs' unzip had lost the plugins' signatures)

      - uses: actions/upload-artifact@v4
        with:
          name: REEVES-${{ matrix.name }}
          path: |
            REEVES-*.zip
            REEVES-*.tar.gz

      - name: release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'release' || github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            REEVES-*.zip
            REEVES-*.tar.gz
